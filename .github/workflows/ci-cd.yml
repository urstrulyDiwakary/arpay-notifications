# =============================================================================
# GitHub Actions CI/CD Pipeline for ARPAY Notifications
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  # =============================================================================
  # Build & Test Job
  # =============================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn -B clean compile

      - name: Run Tests
        run: mvn -B test

      - name: Run Integration Tests
        run: mvn -B verify -DskipUnitTests

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # =============================================================================
  # Security Scan Job
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build project for dependency analysis
        run: mvn -B clean compile -DskipTests

      - name: Run OWASP Dependency Check (Maven Plugin)
        continue-on-error: true
        run: mvn -B org.owasp:dependency-check-maven:check -Dformat=HTML -DfailOnCVSS=9 -DenableRetired=true -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Run Trivy Vulnerability Scanner (CLI)
        continue-on-error: true
        run: mkdir -p reports; curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/install-trivy.sh; sh /tmp/install-trivy.sh -b /usr/local/bin; trivy fs . --severity CRITICAL,HIGH --format sarif --output reports/trivy-results.sarif --exit-code 0

      - name: Upload Trivy Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: trivy-scan-report
          path: reports/trivy-results.sarif
          if-no-files-found: warn

  # =============================================================================
  # Code Quality Job
  # =============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -B clean compile -DskipTests

      - name: Run Spotless Check
        run: mvn -B spotless:check
        continue-on-error: true

      - name: Run PMD Analysis
        run: mvn -B pmd:pmd
        continue-on-error: true

      - name: Upload PMD Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmd-report
          path: target/pmd.xml
          if-no-files-found: warn

  # =============================================================================
  # Build & Push Docker Image Job
  # =============================================================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build, code-quality]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      !cancelled()
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        run: docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push Docker image
        run: IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"; SHA_TAG="sha-${{ github.sha }}"; docker build --build-arg BUILD_DATE="${{ github.event.head_commit.timestamp }}" --build-arg VCS_REF="${{ github.sha }}" -t "$IMAGE_BASE:$SHA_TAG" .; docker push "$IMAGE_BASE:$SHA_TAG"; if [ "${{ github.ref }}" = "refs/heads/main" ]; then docker tag "$IMAGE_BASE:$SHA_TAG" "$IMAGE_BASE:latest"; docker push "$IMAGE_BASE:latest"; fi

      - name: Run Trivy Image Scan (CLI)
        continue-on-error: true
        run: mkdir -p reports; curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/install-trivy.sh; sh /tmp/install-trivy.sh -b /usr/local/bin; IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"; SHA_TAG="sha-${{ github.sha }}"; trivy image "$IMAGE_BASE:$SHA_TAG" --severity CRITICAL,HIGH --format sarif --output reports/trivy-image-results.sarif --exit-code 0

      - name: Upload Trivy Image Scan Results
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: trivy-image-scan-report
          path: reports/trivy-image-results.sarif
          if-no-files-found: warn

  # =============================================================================
  # Deploy to Staging Job
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging-api.arpay.anantarealty.in

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Staging via Coolify API
        run: |
          # Trigger Coolify deployment via API
          curl -X POST "${{ secrets.COOLIFY_API_URL }}/api/v1/projects/${{ secrets.COOLIFY_PROJECT_ID }}/deployments" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "environment": "staging",
              "image_tag": "${{ github.sha }}"
            }'

      - name: Wait for Deployment
        run: sleep 60

      - name: Health Check
        run: |
          for i in {1..10}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.arpay.anantarealty.in/actuator/health)
            if [ "$response" == "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Health check failed (HTTP $response). Retrying..."
            sleep 10
          done
          echo "Health check failed after 10 attempts!"
          exit 1

      - name: Run Smoke Tests
        run: |
          # Add smoke test commands here
          echo "Running smoke tests..."
          # curl -X GET https://staging-api.arpay.anantarealty.in/api/notifications/recent

  # =============================================================================
  # Deploy to Production Job
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://api.arpay.anantarealty.in
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Production via Coolify API
        run: |
          # Trigger Coolify deployment via API
          curl -X POST "${{ secrets.COOLIFY_API_URL }}/api/v1/projects/${{ secrets.COOLIFY_PROJECT_ID }}/deployments" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "environment": "production",
              "image_tag": "${{ github.ref_name }}"
            }'

      - name: Wait for Deployment
        run: sleep 90

      - name: Production Health Check
        run: |
          for i in {1..15}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" https://api.arpay.anantarealty.in/actuator/health)
            if [ "$response" == "200" ]; then
              echo "Production health check passed!"
              exit 0
            fi
            echo "Attempt $i: Production health check failed (HTTP $response). Retrying..."
            sleep 10
          done
          echo "Production health check failed after 15 attempts!"
          exit 1

      - name: Notify Deployment Success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ Production Deployment Successful",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Version", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Deployed By", "value": "${{ github.actor }}", "short": true},
                  {"title": "Environment", "value": "Production", "short": true}
                ]
              }]
            }' || true

      - name: Notify Deployment Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ Production Deployment Failed",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Version", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                  {"title": "Environment", "value": "Production", "short": true}
                ]
              }]
            }' || true

  # =============================================================================
  # Create GitHub Release Job
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Notes
        run: |
          echo "# Release ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "## Changes" >> release-notes.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s" >> release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
